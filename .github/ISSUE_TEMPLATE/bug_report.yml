name: Felrapport
description: Rapportera ett reproducerbart fel utan känslig data.
title: "Fel: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Säkerhetsbrister rapporteras privat via Security → Report a vulnerability, aldrig här.
  - type: textarea
    id: problem
    attributes:
      label: Vad hände?
      description: Använd endast syntetisk data och maskera identifierare.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduktion
      description: Ange minsta möjliga steg för att återskapa felet.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Webbläsare och enhet
  - type: checkboxes
    id: privacy
    attributes:
      label: Datakontroll
      options:
        - label: Rapporten innehåller inga hemligheter eller personuppgifter.
          required: true
